[project]
name = "dupimg"
version = "0.1.0"
description = "Find exact and near-duplicate images, review them side by side, and send the extras to the Recycle Bin."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PySide6-Essentials>=6.8",
    "Pillow>=10.3",
    "pillow-heif>=0.18",
    "ImageHash>=4.3",
    "send2trash>=1.8",
    "rawpy>=0.27.1",
]

[project.gui-scripts]
dupimg = "dupimg.__main__:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dupimg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
